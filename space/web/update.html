<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Luanti Space · Update</title>
    <style>
      body {
        background: #102330;
        color: #e8f2ef;
        font: 17px system-ui;
        max-width: 36rem;
        padding: 2rem;
        margin: auto;
      }
      button,
      a {
        display: block;
        padding: 1rem;
        margin: 1rem 0;
        color: #102330;
        background: #b4edcd;
        border: 0;
        border-radius: 12px;
        font: inherit;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Update your expedition</h1>
    <p>
      This page checks for a complete newer offline build. Your saved world and
      custom ship stay on this device.
    </p>
    <button id="update">Check for updates</button>
    <p id="status" role="status">Connect to the internet, then check.</p>
    <a id="return" href="./" hidden>Open Orbital Expedition</a>
    <script type="module">
      // This page is intentionally outside the cache-first shell, so older builds
      // can reach the updater without clearing Safari storage or losing saves.
      const button = document.querySelector("#update"),
        status = document.querySelector("#status");
      button.onclick = async () => {
        button.disabled = true;
        status.textContent =
          "Checking and installing the complete offline build…";
        try {
          const registration = await navigator.serviceWorker.register(
            "./sw.js",
            { updateViaCache: "none" },
          );
          await registration.update();
          const worker = registration.installing || registration.waiting;
          if (worker && worker.state !== "activated")
            await new Promise((resolve, reject) => {
              const timer = setTimeout(
                () =>
                  reject(Error("Update timed out. Reconnect and try again.")),
                30000,
              );
              const check = () => {
                if (
                  worker.state === "activated" ||
                  worker.state === "redundant"
                ) {
                  clearTimeout(timer);
                  worker.state === "activated"
                    ? resolve()
                    : reject(
                        Error(
                          "Build could not install. Your existing save is unchanged.",
                        ),
                      );
                }
              };
              worker.addEventListener("statechange", check);
              check();
            });
          await navigator.serviceWorker.ready;
          status.textContent =
            "The offline build is ready. Open the expedition, then choose “Recall ship & launch toward destination” to leave the old outpost.";
          document.querySelector("#return").hidden = false;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      };
    </script>
  </body>
</html>
