# Explicit opt-in profile for this game; do not replace your general Luanti config.
# Profiles also apply to remote joins, where server game settings cannot change keys.
free_move = true
fast_move = true
always_fly_fast = false
pitch_move = false
aux1_descends = false
noclip = false
autojump = false
doubletap_jump = false
keymap_sneak = SYSTEM_SCANCODE_224|GAMEPAD_BUTTON_1
keymap_aux1 = SYSTEM_SCANCODE_225|GAMEPAD_BUTTON_2
keymap_zoom = SYSTEM_SCANCODE_21|GAMEPAD_BUTTON_11
camera_smoothing = 0.03
mouse_sensitivity = 0.16
touchscreen_sensitivity = 0.16
touch_interaction_style = buttons_crosshair
virtual_joystick_triggers_aux1 = false
repeat_place_time = 0.2
viewing_range = 100
enable_dynamic_shadows = false
enable_bloom = false
server_announce = false
